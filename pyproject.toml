[project]
name = "conferencia-cartao"
version = "1.0.0"
description = "Conferência automática da fatura do cartão corporativo a partir do PDF"
authors = [{ name = "Gabriel Antônio Ribeiro" }]
requires-python = ">=3.10"
dependencies = ["pdfplumber>=0.11", "pandas>=2.2", "openpyxl>=3.1", "reportlab>=4.0"]

[project.scripts]
conferencia-cartao = "conferencia_cartao.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
